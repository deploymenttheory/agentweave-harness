version: "2"

run:
  timeout: 30m
  # CI mode: fails if go.mod needs updates, ensuring dependencies are properly declared
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  concurrency: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

  # Only fail on new issues, measured against the merge-base with main.
  #
  # Phase 0 shipped this repo lint-clean with `new: false`. The Phase-1
  # extraction then imported the guardrails packages from windows-mcp-server
  # *verbatim* — and with them 79 grandfathered issues (bodyclose, wrapcheck,
  # err113, tagliatelle, ...) that repo also gates around. Fixing them during
  # the extraction would have broken the phase's byte-identical discipline:
  # wrapcheck/err113 fixes change error shapes, bodyclose fixes touch request
  # paths. So the debt moved with the code, deliberately, and this setting
  # matches windows-mcp-server's until the backlog is cleared.
  # `golangci-lint run --new=false` shows the full list; set `new: false` and
  # drop `whole-files` back to true once it reports 0.
  new: true
  new-from-merge-base: main
  whole-files: false

  # Automatically apply any fixable issues (like gofmt/goimports).
  fix: true

linters:
  default: none
  enable:
    # Core correctness & compile checks
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign

    # error-handling best practices
    - errorlint
    - err113

    # Safety & resource handling
    - bodyclose
    - gosec

    # Context discipline
    - contextcheck
    - noctx
    - nilnil

    # Quality & style
    - gocritic
    - prealloc
    - misspell
    - gocyclo
    - wrapcheck

    # Struct-tag discipline
    - musttag
    - tagliatelle

  settings:
    nakedret:
      max-func-lines: 40

    # The audit chain, wire envelopes and policy documents are snake_case JSON,
    # matching the windows-mcp-server artifacts this repo's packages came from
    # (and will keep verifying). tagliatelle defaults to camel, which would
    # contradict that convention.
    tagliatelle:
      case:
        rules:
          json: snake

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # in test files, silence these noisy checks
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
    - golines

  settings:
    golines:
      max-len: 120

    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/deploymenttheory)

  exclusions:
    warn-unused: false
    generated: strict

output:
  formats:
    text:
      path: stderr
      print-linter-name: true
      print-issued-lines: true
      colors: true

  path-mode: ""

  sort-order:
    - severity
    - file

  show-stats: true
