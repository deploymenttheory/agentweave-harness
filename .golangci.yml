version: "2"

run:
  timeout: 30m
  # CI mode: fails if go.mod needs updates, ensuring dependencies are properly declared
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  concurrency: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

  # Report everything, everywhere, deterministically — no merge-base gating.
  # (Gating on "new vs main" cannot describe this repo: the Phase-1 extraction
  # landed the guardrails tree in one PR, so its grandfathered issues would all
  # have counted as new. The imported debt is instead registered explicitly in
  # the exclusion rules below, where shrinking it is visible in diffs.)
  new: false
  whole-files: true

  # Automatically apply any fixable issues (like gofmt/goimports).
  fix: true

linters:
  default: none
  enable:
    # Core correctness & compile checks
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign

    # error-handling best practices
    - errorlint
    - err113

    # Safety & resource handling
    - bodyclose
    - gosec

    # Context discipline
    - contextcheck
    - noctx
    - nilnil

    # Quality & style
    - gocritic
    - prealloc
    - misspell
    - gocyclo
    - wrapcheck

    # Struct-tag discipline
    - musttag
    - tagliatelle

  settings:
    nakedret:
      max-func-lines: 40

    # The audit chain, wire envelopes and policy documents are snake_case JSON,
    # matching the windows-mcp-server artifacts this repo's packages came from
    # (and will keep verifying). tagliatelle defaults to camel, which would
    # contradict that convention.
    tagliatelle:
      case:
        rules:
          json: snake

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # in test files, silence these noisy checks
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

      # Microsoft Graph response DTOs must mirror the API's camelCase field
      # names (deviceId, isCompliant, accountEnabled...). The project-wide
      # snake_case rule is right for our own artifacts — the audit chain, the
      # wire envelopes — but renaming these would break Graph deserialization
      # outright. Ported from windows-mcp-server, which excludes the same file.
      - path: graph\.go
        linters:
          - tagliatelle

      # THE EXTRACTION-DEBT REGISTER. The guardrails packages arrived from
      # windows-mcp-server verbatim in Phase 1, carrying ~61 issues that repo
      # also gates around (its .golangci.yml documents the backlog). Fixing
      # them during the extraction would have broken the phase's
      # byte-identical discipline: wrapcheck/err113 fixes change error shapes,
      # bodyclose fixes touch request paths. This rule is the register of that
      # debt — pay it down by removing linters from this list (run
      # `golangci-lint run` after deleting one to see what's left), never by
      # adding to it. New packages (wire/, internal/, cmd/) get no exemption.
      - path: ^guardrails/
        linters:
          - bodyclose
          - err113
          - gocritic
          - gocyclo
          - noctx
          - prealloc
          - staticcheck
          - unused
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
    - golines

  settings:
    golines:
      max-len: 120

    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/deploymenttheory)

  exclusions:
    warn-unused: false
    generated: strict

output:
  formats:
    text:
      path: stderr
      print-linter-name: true
      print-issued-lines: true
      colors: true

  path-mode: ""

  sort-order:
    - severity
    - file

  show-stats: true
